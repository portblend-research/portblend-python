[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portblend"
version = "0.2.1"
description = "Python SDK and CLI for PortBlend strategy correlation matrix calculation, portfolio weight optimization, and drawdown minimization."
readme = "README.md"
authors = [
    { name = "PortBlend Research", email = "research@portblend.com" }
]
license = { text = "MIT" }
keywords = [
    "correlation-matrix",
    "portfolio-blending",
    "equity-curve",
    "drawdown-minimization",
    "quant-finance",
    "sharpe-optimization"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "tabulate>=0.9.0"
]

[project.scripts]
portblend = "portblend.cli:main"

[project.urls]
Homepage = "https://app.portblend.com"
Documentation = "https://app.portblend.com/docs"
Repository = "https://github.com/portblend-research/portblend-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["portblend*"]

